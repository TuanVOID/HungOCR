name: law-olmocr
services:
  olmocr:
    image: law-olmocr:portable-v1
    restart: unless-stopped
    init: true
    gpus: all
    shm_size: 4gb
    stop_grace_period: 45s
    ports:
      - "${OLMOCR_BIND_IP:-127.0.0.1}:${OLMOCR_PORT:-8011}:8010"
    environment:
      OLMOCR_API_KEY: ${OLMOCR_API_KEY:?Run install.ps1 first}
      OLMOCR_GPU_MEMORY_UTILIZATION: ${OLMOCR_GPU_MEMORY_UTILIZATION:-0.86}
      OLMOCR_IDLE_SECONDS: ${OLMOCR_IDLE_SECONDS:-30}
    volumes:
      - ./models:/models:ro
      - ./overrides/serve.sh:/app/serve.sh:ro
      - ./source/legal_pipeline.py:/app/legal_pipeline.py:ro
      - ./source/ui:/app/ui:ro
      - olmocr-cache:/cache
      - olmocr-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  olmocr-cache:
  olmocr-data:
